<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Clip studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"Archivo";src:url(/fonts/ui-Archivo.ttf) format("truetype");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:"Montserrat Black";src:url(/fonts/Montserrat-Black.ttf)}
@font-face{font-family:"Montserrat ExtraBold";src:url(/fonts/Montserrat-ExtraBold.ttf)}
@font-face{font-family:"Anton";src:url(/fonts/Anton-Regular.ttf)}
@font-face{font-family:"Bebas Neue";src:url(/fonts/BebasNeue-Regular.ttf)}
@font-face{font-family:"Archivo Black";src:url(/fonts/ArchivoBlack-Regular.ttf)}
@font-face{font-family:"Luckiest Guy";src:url(/fonts/LuckiestGuy-Regular.ttf)}
@font-face{font-family:"Bangers";src:url(/fonts/Bangers-Regular.ttf)}
@font-face{font-family:"Poppins ExtraBold";src:url(/fonts/Poppins-ExtraBold.ttf)}
@font-face{font-family:"Poppins Black";src:url(/fonts/Poppins-Black.ttf)}
@font-face{font-family:"DM Serif Display";src:url(/fonts/DMSerifDisplay-Regular.ttf)}
:root{
  --slate:#121922;--panel:#19222d;--raise:#212c39;--line:#2c3947;--text:#e6ebf0;--steel:#8794a3;
  --pencil:#f2c14e;--pencil-ink:#2a2006;--cut:#d4675a;--ok:#7fc8a9;
  --r-s:6px;--r-m:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--slate);color:var(--text);font:400 14px/1.45 Archivo,system-ui,sans-serif;font-stretch:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* top bar */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:24px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:17px;font-weight:650;font-stretch:88%;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .src{color:var(--steel);font-size:12.5px;margin-top:2px}
.top .src a{color:var(--steel)}
.tally{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--steel)}
.ticks{display:flex;gap:3px}
.ticks i{width:10px;height:22px;border-radius:2px;background:var(--raise);border:1px solid var(--line)}
.ticks i.k{background:var(--pencil);border-color:var(--pencil)}
.ticks i.c{background:transparent;border-color:var(--cut);background-image:linear-gradient(135deg,transparent 45%,var(--cut) 45%,var(--cut) 55%,transparent 55%)}
.ticks i.on{box-shadow:0 0 0 2px var(--text)}
.send{background:var(--pencil);color:var(--pencil-ink);border:0;border-radius:var(--r-s);padding:10px 16px;font-weight:700;cursor:pointer}
.send:disabled{opacity:.45;cursor:not-allowed}
.sent{font-size:12.5px;color:var(--ok);max-width:280px}
/* three columns */
.main{display:grid;grid-template-columns:300px minmax(0,1fr) 380px;min-height:0}
.strip{border-right:1px solid var(--line);overflow:auto;padding:10px}
.item{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:8px;border-radius:var(--r-m);cursor:pointer;border:1px solid transparent;width:100%;text-align:left;background:none}
.item:hover{background:var(--panel)}
.item.on{background:var(--panel);border-color:var(--line)}
.thumb{position:relative;width:54px;height:96px;border-radius:5px;overflow:hidden;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rank{position:absolute;left:4px;top:4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(18,25,34,.8)}
.item.k .rank{background:var(--pencil);color:var(--pencil-ink)}
.item .hook{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item.c .hook{text-decoration:line-through;text-decoration-color:var(--cut);color:var(--steel)}
.item .meta{color:var(--steel);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.item .meta b{font-weight:600;color:var(--text)}
/* stage */
.stage{display:flex;flex-direction:column;align-items:center;padding:18px 20px;gap:14px;overflow:auto;min-height:0}
.phone{position:relative;height:min(68vh,720px);aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 0 0 9px #0d131a,0 0 0 10px var(--line)}
.phone video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.phone .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--steel);padding:30px;text-align:center}
.safe{position:absolute;inset:0;pointer-events:none;display:none}
.phone.safeon .safe{display:block}
.safe div{position:absolute;background:repeating-linear-gradient(135deg,rgba(212,103,90,.30) 0 8px,rgba(212,103,90,.12) 8px 16px);border:1px dashed rgba(212,103,90,.8)}
.safe .t{left:0;right:0;top:0;height:12.5%}.safe .b{left:0;right:0;bottom:0;height:26%}.safe .r{right:0;width:16.7%;top:43.7%;bottom:26%}
.transport{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--steel);font-variant-numeric:tabular-nums}
.ghost{background:var(--raise);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;cursor:pointer}
.ghost:hover{border-color:var(--steel)}
.ghost.on{border-color:var(--pencil);color:var(--pencil)}
.trim{width:min(560px,100%);display:grid;gap:10px}
.map{position:relative;height:8px;border-radius:4px;background:var(--raise);margin-bottom:22px}
.map b{position:absolute;top:-3px;height:14px;border-radius:3px;background:var(--pencil)}
.map span{position:absolute;top:12px;font-size:11px;color:var(--steel)}
.ends{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.end{display:flex;gap:4px;align-items:center}
.end.r{justify-content:flex-end}
.end input{width:84px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 4px;font-variant-numeric:tabular-nums}
.end button{background:none;border:1px solid var(--line);border-radius:var(--r-s);padding:6px 7px;cursor:pointer;color:var(--steel);font-size:12px}
.end button:hover{color:var(--text);border-color:var(--steel)}
.len{font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
.len small{display:block;color:var(--steel);font-size:11.5px}
.notice{font-size:13px;color:var(--pencil);display:flex;gap:10px;align-items:center}
.notice.err{color:var(--cut);white-space:pre-wrap;max-width:560px}
/* inspector */
.insp{border-left:1px solid var(--line);overflow:auto;padding:4px 20px 40px}
.insp section{padding:16px 0;border-bottom:1px solid var(--line)}
.insp h2{font-size:13px;font-weight:650;margin:0 0 12px;color:var(--text);font-stretch:92%}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.decide button{border-radius:var(--r-m);padding:12px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--raise)}
.decide .keep.on{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil)}
.decide .cutb.on{background:transparent;color:var(--cut);border-color:var(--cut)}
.decide kbd{font:600 11px Archivo;opacity:.6;margin-left:6px}
.why{color:var(--steel);font-size:12.5px;margin-top:10px}
.f{display:grid;gap:6px;margin-bottom:14px}
.f:last-child{margin-bottom:0}
.f label,.f .lab{font-size:12.5px;color:var(--steel);display:flex;justify-content:space-between}
.f input[type=text],.f textarea,.f select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
.f textarea{min-height:64px;resize:vertical}
.f .over{color:var(--cut)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 8px;cursor:pointer;font-size:12.5px;color:var(--steel)}
.seg button.on{color:var(--text);border-color:var(--text);background:var(--raise)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fonts button{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);padding:8px;cursor:pointer;font-size:17px;line-height:1.1;text-align:left;white-space:nowrap;overflow:hidden}
.fonts button.on{border-color:var(--pencil);color:var(--pencil)}
.sw{display:flex;gap:8px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--slate);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 2px var(--text)}
input[type=range]{width:100%;accent-color:var(--pencil)}
.hint{font-size:12px;color:var(--steel)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.all{margin-top:6px;width:100%}
/* send dialog */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(6,10,14,.7)}
dialog h2{margin:0 0 6px;font-size:18px;font-stretch:90%}
dialog ol{padding-left:20px;color:var(--steel);max-height:220px;overflow:auto}
dialog ol li span{color:var(--text)}
dialog textarea{width:100%;min-height:90px;background:var(--slate);border:1px solid var(--line);border-radius:var(--r-s);padding:10px}
.dlgb{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media (max-width:1180px){.main{grid-template-columns:240px minmax(0,1fr) 330px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div class="app">
  <header class="top">
    <div style="min-width:0"><h1 id="title">Loading…</h1><div class="src" id="src"></div></div>
    <div class="tally"><div class="ticks" id="ticks"></div><span id="tallytxt"></span></div>
    <div id="sendwrap"><button class="send" id="send">Send kept clips</button></div>
  </header>
  <div class="main">
    <nav class="strip" id="strip" aria-label="Clips"></nav>
    <main class="stage">
      <div class="phone" id="phone"><video id="vid" controls playsinline></video><div class="safe"><div class="t"></div><div class="r"></div><div class="b"></div></div></div>
      <div class="transport"><button class="ghost" id="safebtn" title="Shade the areas TikTok covers with its buttons and caption (O)">Show TikTok overlay</button><span id="rendered"></span></div>
      <div class="trim">
        <div class="map" id="map"></div>
        <div class="ends">
          <div class="end"><button data-nudge="start:-1">−1s</button><button data-nudge="start:-0.5">−½</button><input id="start" inputmode="decimal" aria-label="Start time"><button data-nudge="start:0.5">+½</button></div>
          <div class="len" id="len"></div>
          <div class="end r"><button data-nudge="end:-0.5">−½</button><input id="end" inputmode="decimal" aria-label="End time"><button data-nudge="end:0.5">+½</button><button data-nudge="end:1">+1s</button></div>
        </div>
      </div>
      <div class="notice" id="notice"></div>
    </main>
    <aside class="insp" id="insp"></aside>
  </div>
</div>
<dialog id="dlg">
  <h2 id="dlgh"></h2>
  <p class="hint">They render in full quality into the finals folder, each with its TikTok, Instagram and YouTube text. Your AI agent applies the note.</p>
  <ol id="dlglist"></ol>
  <label class="hint" for="dlgnote">Anything else your AI agent should change? (optional)</label>
  <textarea id="dlgnote" placeholder="e.g. make the hook bigger on #3, use the streamer look for all"></textarea>
  <div class="dlgb"><button class="ghost" id="dlgcancel">Keep reviewing</button><button class="send" id="dlgsend">Send</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s), RID0=new URLSearchParams(location.search).get('run');
let RID=null,D=null,cur=0,timers={},editing=false;
const SW=['#F2C14E','#FFE600','#D4AF37','#4DFF55','#4FC2F5','#FF3C3C','#FFFFFF'];
const fmt=s=>{s=Math.max(0,+s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=(s%60).toFixed(1).padStart(4,'0');return (h?h+':'+String(m).padStart(2,'0'):m)+':'+x};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch(p,b!==undefined?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json();if(j.error)note(j.error,true);return j}
function note(t,err){const n=$('#notice');n.className='notice'+(err?' err':'');n.innerHTML=t||''}
const C=()=>D.clips[cur];
function st(c){const L=D.looks[c.look||D.look]||{};const o={...L};for(const k of ['font','caption_size','highlight','uppercase','words_per_chunk','hook_style','grade','speed','music','music_mood','caption_y','captions'])if(c[k]!=null&&c[k]!=='')o[k]=c[k];return o}
function assHex(v){if(!v)return'#FFFFFF';if(v[0]=='#')return v.toUpperCase();const m=v.match(/&H00(..)(..)(..)/i);return m?('#'+m[3]+m[2]+m[1]).toUpperCase():'#FFFFFF'}

async function boot(){const runs=await api('/api/runs');RID=RID0||(runs[0]&&runs[0].id);if(!RID){$('#title').textContent='No clips yet';note('Give your AI agent a video link to get started.');return}await load();show(0)}
async function load(){D=await api('/api/run/'+RID);top_();strip()}
function top_(){
  $('#title').textContent=D.title||RID;
  $('#src').innerHTML=esc(D.channel||'')+(D.duration?' — '+fmt(D.duration).replace(/\.\d$/,''):'')+' — <a target=_blank href="'+esc(D.url)+'">source</a>';
  const k=D.clips.filter(c=>c.status==='approved').length,x=D.clips.filter(c=>c.status==='rejected').length,l=D.clips.length-k-x;
  $('#ticks').innerHTML=D.clips.map((c,i)=>'<i class="'+(c.status==='approved'?'k':c.status==='rejected'?'c':'')+(i===cur?' on':'')+'" title="#'+c.n+'"></i>').join('');
  $('#tallytxt').textContent=k+' kept, '+x+' cut, '+l+' to review';
  const s=D.submission,f=D.clips.filter(c=>c.status==='approved'&&c.final).length;
  if(s){$('#sendwrap').innerHTML='<div class="sent">'+(f>=s.kept.length?'Finals ready: '+f+' clips. <button class="ghost" id="openf">Open folder</button>':'Sent '+s.kept.length+' clips at '+esc(s.at.slice(11,16))+'. Finals ready: '+f+'/'+s.kept.length+'.')+' <button class="ghost" id="resend">Send again</button></div>';
    const o=$('#openf');if(o)o.onclick=()=>api('/api/run/'+RID+'/open',{});$('#resend').onclick=openSend;
    if(f<s.kept.length)setTimeout(()=>load(),4000)}
  else{$('#sendwrap').innerHTML='<button class="send" id="send"'+(k?'':' disabled title="Keep at least one clip first"')+'>Send '+(k||'')+' kept clip'+(k==1?'':'s')+'</button>';$('#send').onclick=openSend}}
function strip(){$('#strip').innerHTML=D.clips.map((c,i)=>{const len=(c.end-c.start)/(+st(c).speed||1);
  return '<button class="item '+(c.status==='approved'?'k':c.status==='rejected'?'c':'')+(i===cur?' on':'')+'" data-i="'+i+'"><div class="thumb">'+(c.poster?'<img alt="" src="'+c.poster+'?v='+c.v+'">':'')+'<span class="rank">'+c.n+'</span></div><div><div class="hook">'+esc(c.hook)+'</div><div class="meta"><b>'+Math.round(len)+'s</b> at '+fmt(c.start).replace(/\.\d$/,'')+(c.preview_sig_ok?'':' — edited')+'</div></div></button>'}).join('')}
function show(i){cur=Math.max(0,Math.min(D.clips.length-1,i));const c=C();top_();strip();
  const v=$('#vid');if(c.preview){const src=c.preview+'?v='+c.v;if(!v.src.endsWith(src)){v.src=src;v.poster=c.poster?c.poster+'?v='+c.v:''}}else v.removeAttribute('src');
  $('#start').value=fmt(c.start);$('#end').value=fmt(c.end);trimInfo();inspector();status_();
  document.querySelector('.item.on')?.scrollIntoView({block:'nearest'})}
function trimInfo(){const c=C(),dur=D.duration||c.end*1.2,sp=+st(c).speed||1;
  $('#map').innerHTML='<b style="left:'+(c.start/dur*100)+'%;width:'+Math.max(.6,(c.end-c.start)/dur*100)+'%"></b><span style="left:0">0:00</span><span style="right:0">'+fmt(dur).replace(/\.\d$/,'')+'</span>';
  $('#len').innerHTML=((c.end-c.start)/sp).toFixed(1)+'s<small>'+(sp!=1?'at '+sp+'x speed':'clip length')+'</small>'}
function status_(){const c=C(),j=c.job,r=c.rendered||{};
  $('#rendered').textContent=r.layout?('Rendered with '+(D.looks[r.look]?.label||r.look)+' look, '+r.layout+' framing'+(r.captions===false?', captions off':'')+(r.music?', music: '+r.music:'')+(r.teaser?', cold open at '+fmt(r.teaser[0]):'')):'';
  if(j&&['queued','rendering'].includes(j.state)){note((j.final?'Rendering final':'Updating preview')+'…');setTimeout(async()=>{await load();show(cur)},2500);return}
  if(j&&j.state==='error'){note('The preview failed to render: '+esc(j.error),true);return}
  if(!c.preview_sig_ok)note('You changed this clip. <button class="ghost" id="upd">Update preview</button> <button class="ghost" id="updall">Update all edited clips</button>');
  else note('');
  const u=$('#upd');if(u)u.onclick=async()=>{await api('/api/run/'+RID+'/clip/'+c.n+'/rerender',{});await load();show(cur)};
  const ua=$('#updall');if(ua)ua.onclick=async()=>{await api('/api/run/'+RID+'/rerender_stale',{});await load();show(cur)}}
function seg(k,opts,val,lab){return '<div class="seg" data-k="'+k+'">'+opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return '<button data-v="'+esc(v)+'" class="'+(String(val)===String(v)?'on':'')+'">'+esc(t)+'</button>'}).join('')+'</div>'}
function inspector(){const c=C(),s=st(c),an=c.analysis||{},hc=(c.hook||'').split(/\s+/).filter(Boolean).length,cl=(c.caption||'').length;
  const subsNote=an.source_subs?'The source already shows subtitles here, so auto turns ours off.':'No subtitles detected in the source.';
  const bedNote=an.has_bed===true?'The source already has music or background sound.':an.has_bed===false?'The source voice is dry (no music under it).':'Couldn\'t tell whether the source has music.';
  const lib=D.music[s.music_mood]||0;
  $('#insp').innerHTML=
  '<section><h2>Decision</h2><div class="decide"><button class="keep'+(c.status==='approved'?' on':'')+'" data-st="approved">Keep<kbd>Y</kbd></button><button class="cutb'+(c.status==='rejected'?' on':'')+'" data-st="rejected">Cut<kbd>N</kbd></button></div><div class="why">'+esc(c.why)+'</div></section>'+
  '<section><h2>Words</h2>'+
   '<div class="f"><label for="hook">On-screen hook <span class="'+(hc>8?'over':'')+'">'+hc+' words</span></label><input type="text" id="hook" data-k="hook" value="'+esc(c.hook)+'"></div>'+
   '<div class="f"><label for="cap">TikTok caption <span class="'+(cl>150?'over':'')+'">'+cl+'/150</span></label><textarea id="cap" data-k="caption">'+esc(c.caption)+'</textarea></div>'+
   '<div class="f"><label for="tags">Hashtags</label><input type="text" id="tags" data-k="hashtags" value="'+esc((c.hashtags||[]).join(' '))+'"></div></section>'+
  '<section><h2>Cold open</h2><div class="f">'+seg('teaser',[['on','Show the peak moment first'],['off','Off']],c.teaser||'on')+
   '<span class="hint">The clip opens on its most intense 1.5–3 seconds, flashes white, then plays from the start.</span></div>'+
   ((c.teaser||'on')==='on'?'<div class="row2"><div class="f"><label>Moment starts</label><input type="text" data-t="teaser_start" value="'+((c.rendered?.teaser?.[0]??c.teaser_start)!=null?fmt(c.rendered?.teaser?.[0]??c.teaser_start):'')+'" placeholder="auto"></div><div class="f"><label>Moment ends</label><input type="text" data-t="teaser_end" value="'+((c.rendered?.teaser?.[1]??c.teaser_end)!=null?fmt(c.rendered?.teaser?.[1]??c.teaser_end):'')+'" placeholder="auto"></div></div>':'')+
  '</section>'+
  '<section><h2>Look</h2>'+
   '<div class="f"><select data-k="look" aria-label="Look">'+Object.entries(D.looks).map(([k,v])=>'<option value="'+k+'"'+((c.look||D.look)===k?' selected':'')+'>'+esc(v.label)+(k===D.look?' (suggested)':'')+'</option>').join('')+'</select></div>'+
   '<div class="f"><span class="lab">Caption font</span><div class="fonts" data-k="font">'+D.fonts.map(f=>'<button data-v="'+esc(f)+'" class="'+(s.font===f?'on':'')+'" style="font-family:\''+f+'\'">'+esc(f)+'</button>').join('')+'</div></div>'+
   '<div class="row2"><div class="f"><span class="lab">Words at a time</span>'+seg('words_per_chunk',[1,2,3,4],s.words_per_chunk)+'</div><div class="f"><span class="lab">Letters</span>'+seg('uppercase',[['true','CAPS'],['false','Normal']],s.uppercase)+'</div></div>'+
   '<div class="f"><span class="lab">Highlight colour</span><div class="sw" data-k="highlight">'+SW.map(h=>'<button data-v="'+h+'" class="'+(assHex(s.highlight)===h?'on':'')+'" style="background:'+h+'" aria-label="'+h+'"></button>').join('')+'</div></div>'+
   '<div class="f"><label for="csz">Caption size <span>'+s.caption_size+'</span></label><input type="range" id="csz" min="56" max="130" step="2" data-k="caption_size" value="'+s.caption_size+'"></div>'+
   '<div class="f"><label for="cy">Caption height <span>'+Math.round(s.caption_y*100)+'% down</span></label><input type="range" id="cy" min="0.35" max="0.72" step="0.01" data-k="caption_y" value="'+s.caption_y+'"></div>'+
   '<div class="f"><span class="lab">Captions</span>'+seg('captions',[['auto','Auto'],['on','On'],['off','Off']],c.captions||'auto')+'<span class="hint">'+subsNote+'</span></div>'+
   '<div class="f"><span class="lab">Hook style</span>'+seg('hook_style',[['box','White box'],['serif','Cinematic serif'],['none','No hook']],s.hook_style)+'</div>'+
   '<div class="f"><span class="lab">Speed</span>'+seg('speed',[[1,'1x'],[1.05,'1.05x'],[1.1,'1.1x'],[1.15,'1.15x']],s.speed)+'</div>'+
   '<div class="f"><span class="lab">Colour grade</span>'+seg('grade',[['none','None'],['cinematic','Cinematic'],['punchy','Punchy'],['warm','Warm']],s.grade)+'</div>'+
   '<div class="f"><span class="lab">Background music</span>'+seg('music',[['off','Off'],['auto','If source is dry'],['on','On']],s.music)+
     '<select data-k="music_mood" aria-label="Music mood">'+['epic','emotional','hype','chill','lofi','comedy'].map(m=>'<option'+(s.music_mood===m?' selected':'')+'>'+m+'</option>').join('')+'</select>'+
     '<span class="hint">'+bedNote+' '+(lib?lib+' tracks in the '+esc(s.music_mood)+' folder.':'No tracks in music\\'+esc(s.music_mood)+' yet, so nothing will be added.')+'</span></div>'+
   '<button class="ghost all" id="applyall">Use this look on every clip</button></section>'+
  '<section><h2>Framing</h2>'+seg('layout',[['auto','Auto'],['crop','Fill'],['letterbox','Letterbox'],['blur','Blurred'],['facecam','Webcam + game']],c.layout||'auto')+
   ((c.layout==='crop'||c.layout==='facecam')?'<div class="f" style="margin-top:12px"><label>Horizontal position <span>'+(c.cx??'auto')+'</span></label><input type="range" min="0" max="1" step="0.01" data-k="cx" value="'+(c.cx??0.5)+'"></div>':'')+
   (c.layout==='facecam'?'<div class="f"><label>Webcam vertical <span>'+(c.cy??'auto')+'</span></label><input type="range" min="0" max="1" step="0.01" data-k="cy" value="'+(c.cy??0.2)+'"></div><div class="f"><label>Webcam zoom <span>'+(c.fw??'auto')+'</span></label><input type="range" min="0.02" max="0.25" step="0.005" data-k="fw" value="'+(c.fw??0.08)+'"></div>':'')+
  '</section>'+
  '<section><h2>Note for your AI agent</h2><div class="f"><textarea data-k="note" placeholder="Anything specific about this clip">'+esc(c.note||'')+'</textarea></div></section>'}

function save(fields,redraw){const c=C();Object.assign(c,fields);c.preview_sig_ok=c.preview_sig_ok&&!Object.keys(fields).some(k=>!['status','caption','hashtags','note'].includes(k));
  api('/api/run/'+RID+'/clip/'+c.n,fields);if(redraw){inspector()}top_();strip();trimInfo();status_()}
const NUM=['caption_size','caption_y','speed','words_per_chunk','cx','cy','fw'];
document.addEventListener('click',e=>{const it=e.target.closest('.item');if(it)return show(+it.dataset.i);
  const b=e.target.closest('[data-st]');if(b){const v=C().status===b.dataset.st?'':b.dataset.st;save({status:v},true);return}
  const sg=e.target.closest('.seg button,.fonts button,.sw button');if(sg){const k=sg.parentElement.dataset.k;let v=sg.dataset.v;if(NUM.includes(k))v=+v;save({[k]:v},true);return}
  const n=e.target.closest('[data-nudge]');if(n){const [k,d]=n.dataset.nudge.split(':');const v=Math.round((C()[k]+ +d)*10)/10;$('#'+k).value=fmt(v);save({[k]:v});return}
  if(e.target.id==='applyall'){const c=C(),f={look:c.look||D.look};for(const k of ['font','caption_size','highlight','uppercase','words_per_chunk','hook_style','grade','speed','music','music_mood','caption_y','captions'])if(c[k]!=null)f[k]=c[k];
    api('/api/run/'+RID+'/apply_all',f).then(async()=>{await load();show(cur);note('Look applied to every clip. <button class="ghost" id="updall2">Update all previews</button>');$('#updall2').onclick=async()=>{await api('/api/run/'+RID+'/rerender_stale',{});await load();show(cur)}})}
  if(e.target.id==='safebtn'){$('#phone').classList.toggle('safeon');e.target.classList.toggle('on')}});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;let v=e.target.value;
  if(k==='hashtags')v=v.split(/\s+/).filter(Boolean).map(t=>t[0]==='#'?t:'#'+t);if(NUM.includes(k))v=+v;
  const lab=e.target.closest('.f')?.querySelector('label span');if(lab&&e.target.type==='range')lab.textContent=k==='caption_y'?Math.round(v*100)+'% down':v;
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>save({[k]:v}),350)});
document.addEventListener('change',e=>{const k=e.target.dataset.k;if(k&&e.target.tagName==='SELECT')save({[k]:e.target.value},true);
  if(e.target.dataset.t){const v=parseT(e.target.value);if(!isNaN(v))save({[e.target.dataset.t]:v});else if(e.target.value.trim())note('Type a time like 2:05.5',true);return}
  if(e.target.id==='start'||e.target.id==='end'){const v=parseT(e.target.value);if(!isNaN(v)){save({[e.target.id]:v});e.target.value=fmt(v)}else{note('Type a time like 2:05.5 or 125.5',true)}}});
function parseT(s){s=String(s).trim();if(!s)return NaN;const p=s.split(':').map(Number);if(p.some(isNaN))return NaN;return p.reduce((a,x)=>a*60+x,0)}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,dialog'))return;
  if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();show(cur+1)}else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();show(cur-1)}
  else if(e.key==='y'){save({status:C().status==='approved'?'':'approved'},true)}else if(e.key==='n'){save({status:C().status==='rejected'?'':'rejected'},true)}
  else if(e.key==='o'){$('#safebtn').click()}else if(e.key===' '){e.preventDefault();const v=$('#vid');v.paused?v.play():v.pause()}});
function openSend(){const k=D.clips.filter(c=>c.status==='approved');if(!k.length)return;$('#dlgh').textContent='Send '+k.length+' clip'+(k.length==1?'':'s');
  $('#dlglist').innerHTML=k.map(c=>'<li><span>'+esc(c.hook)+'</span> — '+Math.round((c.end-c.start)/(+st(c).speed||1))+'s</li>').join('');$('#dlg').showModal()}
$('#dlgcancel').onclick=()=>$('#dlg').close();
$('#dlgsend').onclick=async()=>{const r=await api('/api/run/'+RID+'/submit',{note:$('#dlgnote').value});$('#dlg').close();if(r.ok){await load();show(cur)}};
boot();
</script></body></html>
